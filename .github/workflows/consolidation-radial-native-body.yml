name: DOBO Consolidation Radial Native Body

on:
  push:
    branches: [integration-consolidation-core]
    paths:
      - 'app/product_generators/design_interpreter/body_family_expansion.py'
      - 'app/product_generators/design_interpreter/native_radial_cad_adapter.py'
      - 'app/product_generators/design_interpreter/radial_native_body_regression.py'
      - 'app/product_generators/design_interpreter/structural_pipeline.py'
      - '.github/workflows/consolidation-radial-native-body.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/product_generators/design_interpreter/body_family_expansion.py'
      - 'app/product_generators/design_interpreter/native_radial_cad_adapter.py'
      - 'app/product_generators/design_interpreter/radial_native_body_regression.py'
      - 'app/product_generators/design_interpreter/structural_pipeline.py'
      - '.github/workflows/consolidation-radial-native-body.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radial-native-body:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: app:tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install geometry stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema cadquery numpy scipy trimesh scikit-image shapely Pillow

      - name: Run radial native body physical regression
        run: python -m product_generators.design_interpreter.radial_native_body_regression

      - name: Upload radial body evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-radial-native-body-evidence
          path: outputs-ci/radial-native-body
          if-no-files-found: warn
          retention-days: 30
