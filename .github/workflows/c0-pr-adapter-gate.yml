name: DOBO C0 PR Adapter Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: app
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing geometry stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest cadquery numpy scipy scikit-image trimesh networkx shapely Pillow matplotlib
      - name: Execute exact branching adapter gate
        run: |
          python -m pytest app/product_generators/surface_designer/test_c0_advanced_body_adapter_gate.py -q
