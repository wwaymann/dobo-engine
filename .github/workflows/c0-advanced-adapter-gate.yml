name: DOBO C0 Advanced Body Adapter Gate

on:
  push:
    branches:
      - c0-advanced-morphology-through-123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: app
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing geometry stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy scipy scikit-image trimesh networkx shapely Pillow
      - name: Preserve semantic morphology contract
        run: |
          python -m product_generators.design_interpreter.test_phase_4a_structural_vocabulary
          python -m product_generators.design_interpreter.test_phase_5_generalized_design_grammar
          python -m product_generators.design_interpreter.test_phase_6_structural_morphogenesis
          python -m product_generators.design_interpreter.test_macroblock_a2_morphological_integration
          python -m product_generators.design_interpreter.test_macroblock_a3_continuous_fusion
          python -m product_generators.design_interpreter.test_macroblock_a4_visible_continuity
      - name: Generate exact advanced branching morphology
        run: |
          rm -rf outputs-ci/c0-adapter
          python -m product_generators.design_interpreter.macroblock_a4_matrix_cli --output-root outputs-ci/c0-adapter --case branching
      - name: Connect exact STL to CadQuery SurfaceDesigner contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          import cadquery as cq
          from product_generators.surface_designer.advanced_body_adapter import load_advanced_stl_as_cadquery_shape
          from product_generators.surface_designer.designer import SurfaceDesigner
          from product_generators.surface_designer.contracts import SurfaceDesignMode

          root = Path('outputs-ci/c0-adapter')
          stl = next(root.rglob('*.stl'))
          mesh = trimesh.load_mesh(stl, process=False)
          shape = load_advanced_stl_as_cadquery_shape(stl)
          bb = shape.BoundingBox()
          mesh_ext = mesh.bounds
          occ_ext = ((bb.xmin, bb.ymin, bb.zmin), (bb.xmax, bb.ymax, bb.zmax))
          max_delta = max(abs(float(mesh_ext[i][j]) - float(occ_ext[i][j])) for i in range(2) for j in range(3))
          print('ADAPTER_SOURCE_TYPE', type(mesh).__module__ + '.' + type(mesh).__name__)
          print('ADAPTER_TARGET_TYPE', type(shape).__module__ + '.' + type(shape).__name__)
          print('ADAPTER_FACE_COUNT', len(shape.Faces()))
          print('ADAPTER_BOUNDS_MAX_DELTA_MM', max_delta)
          if max_delta > 1e-3:
              raise SystemExit('Adapter changed source morphology bounds.')

          # Prove the imported object reaches the existing SurfaceDesigner API.
          faces = sorted(shape.Faces(), key=lambda f: f.Area(), reverse=True)
          if not faces:
              raise SystemExit('No OCC face available for SurfaceDesigner.')
          base_volume = float(shape.Volume())
          try:
              result = SurfaceDesigner().add_text(
                  base_shape=shape,
                  target_face=faces[0],
                  text='DOBO',
                  size=12.0,
                  mode=SurfaceDesignMode.EMBOSS,
                  depth=1.8,
                  width_fraction=0.32,
                  height_fraction=0.18,
                  u_center=0.5,
                  v_center=0.64,
                  font='Arial',
                  kind='bold',
              )
              final_volume = float(result.shape.Volume())
              verdict = {'adapter':'PASS','surface_designer_entry':'PASS','text':'PASS','base_volume':base_volume,'final_volume':final_volume,'bounds_delta_mm':max_delta}
              if final_volume <= base_volume:
                  raise RuntimeError('Emboss did not increase volume.')
          except Exception as exc:
              verdict = {'adapter':'PASS','surface_designer_entry':'PASS','text':'FAIL','boundary':'native_face_on_imported_triangulated_body','error_type':type(exc).__name__,'error':str(exc),'bounds_delta_mm':max_delta}
              Path(root/'adapter_verdict.json').write_text(json.dumps(verdict, indent=2)+'\n')
              print(json.dumps(verdict, indent=2))
              raise
          Path(root/'adapter_verdict.json').write_text(json.dumps(verdict, indent=2)+'\n')
          print(json.dumps(verdict, indent=2))
          PY
      - name: Preserve unchanged old complete product path
        if: always()
        run: |
          python -m product_generators.surface_designer.test_phase_5_json_composition
          python -m product_generators.surface_designer.test_phase_6_multicolor_3mf
      - name: Upload adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-c0-advanced-body-adapter-evidence
          path: outputs-ci/c0-adapter
          if-no-files-found: warn
          retention-days: 30
