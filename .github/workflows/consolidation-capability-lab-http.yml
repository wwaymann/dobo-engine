name: DOBO Capability Lab HTTP Primitive Routing

on:
  push:
    branches: [integration-consolidation-core]
    paths:
      - 'tools/dobo_capability_lab.py'
      - 'tools/dobo_capability_lab_live.py'
      - 'tools/dobo_capability_repairs.py'
      - 'tools/dobo_retry_repairs.py'
      - 'app/product_generators/design_interpreter/body_family_expansion.py'
      - 'app/product_generators/design_interpreter/native_tapered_cad_adapter.py'
      - 'app/product_generators/design_interpreter/structural_pipeline.py'
      - '.github/workflows/consolidation-capability-lab-http.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/dobo_capability_lab.py'
      - 'tools/dobo_capability_lab_live.py'
      - 'tools/dobo_capability_repairs.py'
      - 'tools/dobo_retry_repairs.py'
      - 'app/product_generators/design_interpreter/body_family_expansion.py'
      - 'app/product_generators/design_interpreter/native_tapered_cad_adapter.py'
      - 'app/product_generators/design_interpreter/structural_pipeline.py'
      - '.github/workflows/consolidation-capability-lab-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-server-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: app:tools
      DOBO_LAB_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Lab runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai jsonschema cadquery numpy scipy trimesh scikit-image shapely Pillow

      - name: Start actual DOBO Lab HTTP server
        run: |
          python tools/dobo_capability_lab_live.py > /tmp/dobo-lab.log 2>&1 &
          echo $! > /tmp/dobo-lab.pid
          python - <<'PY'
          import time
          import urllib.request

          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1) as response:
                      if response.status == 200:
                          print('DOBO Lab HTTP server is ready')
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError('DOBO Lab HTTP server did not become ready.')
          PY

      - name: POST exact cone button prompt through browser API
        run: |
          mkdir -p outputs-ci/capability-lab-http-cone
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import urllib.request

          payload = json.dumps({
              'prompt': 'Crea una maceta cono',
              'mode': 'auto',
          }).encode('utf-8')
          request = urllib.request.Request(
              'http://127.0.0.1:8765/api/generate',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.loads(response.read().decode('utf-8'))

          out = Path('outputs-ci/capability-lab-http-cone')
          (out / 'HTTP_RESPONSE.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          if not result.get('ok'):
              raise RuntimeError(f"HTTP Lab generation failed: {result!r}")

          motor = result.get('motor', {})
          validation = result.get('validation', {})
          vessel = result.get('vessel', {})
          trace = result.get('trace', {})
          audit = {
              'schema': 'dobo.capability_lab.http_cone.1',
              'source': result.get('source'),
              'profile': result.get('profile'),
              'morphology': result.get('morphology'),
              'capability_route': motor.get('_capability_route'),
              'live_lab_version': trace.get('live_lab_version'),
              'trace_route': trace.get('capability_route'),
              'vertices': trace.get('vertices'),
              'faces': trace.get('faces'),
              'watertight': validation.get('watertight'),
              'winding_consistent': validation.get('winding_consistent'),
              'component_count': validation.get('component_count'),
              'opening': bool(vessel.get('opening')),
              'drain': bool(vessel.get('drain')),
              'analytic_tapered': motor.get('_analytic_tapered'),
          }
          checks = [
              audit['source'] == 'offline-semantic',
              audit['morphology'] == 'tapered_revolution',
              audit['capability_route'] == 'analytic_cad_tapered_primitive',
              audit['trace_route'] == 'analytic_cad_tapered_primitive',
              audit['live_lab_version'] == 'LABLIVE.4-promoted-route-guard',
              bool(audit['watertight']),
              bool(audit['winding_consistent']),
              int(audit['component_count'] or 0) == 1,
              audit['opening'],
              audit['drain'],
              0 < int(audit['vertices'] or 0) < 20_000,
              0 < int(audit['faces'] or 0) < 40_000,
          ]
          audit['verdict'] = 'PASS' if all(checks) else 'FAIL'
          (out / 'HTTP_CONE_AUDIT.json').write_text(
              json.dumps(audit, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          if audit['verdict'] != 'PASS':
              raise RuntimeError(
                  'Actual DOBO Lab HTTP path did not use the promoted analytic cone route.'
              )
          PY

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/dobo-lab.log || true

      - name: Stop DOBO Lab server
        if: always()
        run: |
          if [ -f /tmp/dobo-lab.pid ]; then
            kill "$(cat /tmp/dobo-lab.pid)" 2>/dev/null || true
          fi

      - name: Upload HTTP routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-capability-lab-http-cone
          path: outputs-ci/capability-lab-http-cone
          if-no-files-found: warn
          retention-days: 30
