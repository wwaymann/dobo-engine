name: DOBO C0 Spherical DOBO Test

on:
  push:
    branches: [c0-advanced-morphology-through-123]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spherical-dobo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: app
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing DOBO stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy Pillow trimesh

      - name: Build spherical planter using existing primitive and text surface capability
        run: |
          mkdir -p outputs-ci/c0-spherical-dobo
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import cadquery as cq
          from product_generators.surface_designer.face_selector import SurfaceFaceSelector
          from product_generators.surface_designer.native_text_face import NativeTextFaceDecorator

          out = Path('outputs-ci/c0-spherical-dobo')

          # New probe dimensions and a different creation point.
          # Build the primitive through Workplane.sphere(), which explicitly creates
          # a full sphere around the workplane origin, then translate the finished
          # primitive to the requested center. This avoids the previous low-level
          # makeSphere positional-argument ambiguity.
          radius = 60.0
          wall = 4.0
          opening_radius = 22.0
          creation_origin = cq.Vector(0, 0, 0)
          center = cq.Vector(0, 0, 70.0)
          center_z = center.z

          opening_plane_z = center_z + math.sqrt(radius * radius - opening_radius * opening_radius)
          opening_cut_start_z = opening_plane_z - 1.0
          opening_cut_height = 16.0

          trace = {
              'case_id': 'c0-spherical-dobo-test',
              'purpose': 'shape-substitution probe',
              'creates_new_engine_behavior': False,
              'creates_new_geometry_capability': False,
              'change_from_conic_reference': 'body family only: conic -> spherical',
              'body': {
                  'family': 'spherical_planter',
                  'radius_mm': radius,
                  'diameter_mm': radius * 2.0,
                  'wall_mm': wall,
                  'opening_radius_mm': opening_radius,
                  'creation_origin_mm': [creation_origin.x, creation_origin.y, creation_origin.z],
                  'center_mm': [center.x, center.y, center.z],
                  'opening_plane_z_mm': opening_plane_z,
                  'opening_cut_start_z_mm': opening_cut_start_z,
              },
              'front': {'kind': 'text', 'content': 'DOBO', 'mode': 'emboss', 'depth_mm': 1.8},
          }
          (out/'EXECUTED_SPECIFICATION.json').write_text(json.dumps(trace, indent=2), encoding='utf-8')

          outer = cq.Workplane('XY').sphere(radius).val().translate(center)
          inner = cq.Workplane('XY').sphere(radius-wall).val().translate(center)
          shell = outer.cut(inner, tol=0.005).clean()

          outer_bb = outer.BoundingBox()
          shell_bb = shell.BoundingBox()
          print('SPHERICAL OUTER BBOX', [outer_bb.xlen, outer_bb.ylen, outer_bb.zlen])
          print('SPHERICAL SHELL BBOX', [shell_bb.xlen, shell_bb.ylen, shell_bb.zlen])
          if not (119.0 <= shell_bb.xlen <= 121.0 and 119.0 <= shell_bb.ylen <= 121.0 and 119.0 <= shell_bb.zlen <= 121.0):
              raise RuntimeError(f'Spherical shell dimensions invalid before opening cut: {[shell_bb.xlen, shell_bb.ylen, shell_bb.zlen]}')

          opening = cq.Solid.makeCylinder(
              opening_radius,
              opening_cut_height,
              cq.Vector(0, 0, opening_cut_start_z),
          )
          base = shell.cut(opening, tol=0.005).clean()
          if not base.isValid() or len(base.Solids()) != 1:
              raise RuntimeError('Spherical planter base invalid')

          bb = base.BoundingBox()
          print('SPHERICAL BASE BBOX', [bb.xlen, bb.ylen, bb.zlen])
          if not (115.0 <= bb.xlen <= 125.0 and 115.0 <= bb.ylen <= 125.0 and 110.0 <= bb.zlen <= 122.0):
              raise RuntimeError(f'Spherical planter opening cut truncated body: {[bb.xlen, bb.ylen, bb.zlen]}')

          face = SurfaceFaceSelector().largest_external(base, geom_type='SPHERE')
          text = NativeTextFaceDecorator().decorate(
              base_shape=base,
              target_face=face,
              text_value='DOBO',
              size=14.0,
              depth=1.8,
              mode='emboss',
              font='Arial',
              kind='bold',
              width_fraction=0.30,
              height_fraction=0.16,
              u_center=0.25,
              v_center=0.50,
          )
          text.validate()
          final = text.shape.clean()
          if not final.isValid() or len(final.Solids()) != 1:
              raise RuntimeError('Spherical DOBO result invalid')

          bb = final.BoundingBox()
          print('SPHERICAL FINAL BBOX', [bb.xlen, bb.ylen, bb.zlen])
          if not (115.0 <= bb.xlen <= 128.0 and 115.0 <= bb.ylen <= 128.0 and 110.0 <= bb.zlen <= 124.0):
              raise RuntimeError(f'DOBO decoration truncated spherical body: {[bb.xlen, bb.ylen, bb.zlen]}')

          cq.exporters.export(final, str(out/'dobo_spherical.step'))
          cq.exporters.export(final, str(out/'dobo_spherical.stl'), tolerance=0.03, angularTolerance=0.08)
          print('SPHERICAL DOBO TEST OK')
          print(json.dumps(trace, indent=2))
          PY

      - name: Validate transport mesh
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import trimesh
          p=Path('outputs-ci/c0-spherical-dobo/dobo_spherical.stl')
          mesh=trimesh.load_mesh(p, process=True)
          if mesh.is_empty or len(mesh.faces) < 100:
              raise RuntimeError('Spherical STL empty or implausibly small')
          if not all(math.isfinite(float(v)) for v in mesh.vertices.reshape(-1)):
              raise RuntimeError('Non-finite STL vertices')
          ext=mesh.extents
          if not (115 <= float(ext[0]) <= 128 and 115 <= float(ext[1]) <= 128 and 110 <= float(ext[2]) <= 124):
              raise RuntimeError(f'Unexpected spherical planter extents: {ext.tolist()}')
          print('SPHERICAL STL OK', ext.tolist())
          PY

      - name: Install Blender and render review views
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb xauth libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0
          mkdir -p outputs-ci/c0-spherical-dobo/renders
          xvfb-run -a -s '-screen 0 1280x1024x24' blender --background --python tools/dobo_blender_acceptance.py -- \
            --stl outputs-ci/c0-spherical-dobo/dobo_spherical.stl \
            --output-root outputs-ci/c0-spherical-dobo/renders --label spherical_dobo --resolution 512

      - name: Build visual review sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('outputs-ci/c0-spherical-dobo')
          views=['front','side','top','iso']
          imgs=[Image.open(root/'renders'/f'spherical_dobo_{v}.png').convert('RGB') for v in views]
          sheet=Image.new('RGB',(2048,580),'white')
          d=ImageDraw.Draw(sheet)
          d.text((12,10),'DOBO SPHERICAL TEST — alternate origin and dimensions',fill='black')
          d.text((12,28),'Full 120 mm sphere via Workplane.sphere; existing DOBO emboss capability',fill='black')
          for i,(v,img) in enumerate(zip(views,imgs)):
              sheet.paste(img,(i*512,60))
              d.text((i*512+12,44),v,fill='black')
          sheet.save(root/'DOBO_SPHERICAL_REVIEW.jpg',quality=94)
          PY

      - name: Upload spherical test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-c0-spherical-dobo-test
          path: outputs-ci/c0-spherical-dobo
          if-no-files-found: error
          retention-days: 30
