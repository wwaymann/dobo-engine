name: DOBO C0 Capability Layer Audit

on:
  push:
    branches: [c0-advanced-morphology-through-123]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dobo-c0-capability-layer-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-layer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: app
      PYTHONUNBUFFERED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'

    steps:
      - name: Checkout accumulated C0 tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install the same existing geometry stack used by C0 gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy scipy scikit-image trimesh networkx shapely Pillow matplotlib

      - name: Audit every existing capability layer without adding engine behavior
        run: |
          mkdir -p outputs-ci/c0-capability-audit/logs
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / 'outputs-ci' / 'c0-capability-audit'
          LOGS = OUT / 'logs'
          OUT.mkdir(parents=True, exist_ok=True)
          LOGS.mkdir(parents=True, exist_ok=True)

          # These are existing product-generator capability areas in the accumulated tree.
          # The audit discovers and executes their existing test_*.py modules; it does not
          # create geometry, algorithms, engines, or fallback capabilities.
          LAYERS = [
              'design_interpreter',
              'organic_shapes',
              'vector_geometry',
              'surface_mapping',
              'surface_features',
              'decorative_patterns',
              'surface_designer',
              'manufacturability',
          ]

          # Explicit accumulated route already present in c0-integration-123.yml. Re-running
          # these existing tests as one route answers a different question from unit/layer
          # discovery: can the accepted layers still be traversed together in sequence?
          ACCUMULATED_ROUTE = [
              'product_generators.design_interpreter.test_phase_3a_semantic_contract',
              'product_generators.design_interpreter.test_phase_3b_semantic_compiler',
              'product_generators.design_interpreter.test_phase_4a_structural_vocabulary',
              'product_generators.design_interpreter.test_phase_5_generalized_design_grammar',
              'product_generators.design_interpreter.test_phase_6_structural_morphogenesis',
              'product_generators.design_interpreter.test_phase_6_advanced_visual_geometry',
              'product_generators.design_interpreter.test_macroblock_a2_morphological_integration',
              'product_generators.design_interpreter.test_macroblock_a3_continuous_fusion',
              'product_generators.design_interpreter.test_macroblock_a4_visible_continuity',
              'product_generators.surface_designer.test_phase_5_json_composition',
              'product_generators.surface_designer.test_phase_6_multicolor_3mf',
              'product_generators.manufacturability.test_phase_7_9_consolidated_validator',
              'product_generators.manufacturability.test_macroblock_b_final_geometry',
              'product_generators.manufacturability.test_phase_7_10_real_product_validation',
              'product_generators.manufacturability.test_macroblock_b_planned_3mf_export',
              'product_generators.manufacturability.test_macroblock_b_3mf_placement',
              'product_generators.manufacturability.test_macroblock_b_production_handoff',
          ]

          def module_from_file(path: Path) -> str:
              rel = path.relative_to(ROOT / 'app').with_suffix('')
              return '.'.join(rel.parts)

          def execute(module: str, label: str, ordinal: int) -> dict:
              safe = module.replace('.', '_')
              logfile = LOGS / f'{label}_{ordinal:03d}_{safe}.log'
              started = time.monotonic()
              env = os.environ.copy()
              env['PYTHONPATH'] = 'app'
              try:
                  completed = subprocess.run(
                      [sys.executable, '-m', module],
                      cwd=ROOT,
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=600,
                  )
                  output = completed.stdout or ''
                  rc = completed.returncode
                  status = 'PASS' if rc == 0 else 'FAIL'
                  error = None
              except subprocess.TimeoutExpired as exc:
                  output = (exc.stdout or '') if isinstance(exc.stdout, str) else ''
                  output += '\nTIMEOUT after 600 seconds\n'
                  rc = 124
                  status = 'FAIL'
                  error = 'TIMEOUT'
              except Exception as exc:
                  output = f'{type(exc).__name__}: {exc}\n'
                  rc = 125
                  status = 'FAIL'
                  error = type(exc).__name__
              logfile.write_text(output, encoding='utf-8', errors='replace')
              duration = round(time.monotonic() - started, 3)
              print(f'[{status}] {label}: {module} ({duration}s)')
              return {
                  'scope': label,
                  'module': module,
                  'status': status,
                  'returncode': rc,
                  'duration_s': duration,
                  'log': str(logfile.relative_to(ROOT)),
                  'error': error,
              }

          report = {
              'schema': 'dobo.c0.capability_audit.1',
              'commit': os.environ.get('GITHUB_SHA'),
              'ref': os.environ.get('GITHUB_REF'),
              'policy': {
                  'creates_new_engine_behavior': False,
                  'creates_new_geometry_capability': False,
                  'purpose': 'exercise and map only capabilities already present in the accumulated C0 tree',
              },
              'layers': {},
              'accumulated_route': [],
          }

          global_index = 0
          all_layer_results = []

          for layer in LAYERS:
              base = ROOT / 'app' / 'product_generators' / layer
              tests = sorted(base.rglob('test_*.py')) if base.exists() else []
              layer_results = []
              for path in tests:
                  global_index += 1
                  layer_results.append(execute(module_from_file(path), layer, global_index))
              if not tests:
                  layer_status = 'UNVERIFIED'
              elif all(r['status'] == 'PASS' for r in layer_results):
                  layer_status = 'PASS'
              else:
                  layer_status = 'FAIL'
              report['layers'][layer] = {
                  'status': layer_status,
                  'discovered_tests': len(tests),
                  'results': layer_results,
              }
              all_layer_results.extend(layer_results)

          # Run the already-defined accumulated route in strict order, but keep collecting
          # evidence after failures so the artifact shows the full integration boundary.
          for idx, module in enumerate(ACCUMULATED_ROUTE, start=1):
              report['accumulated_route'].append(execute(module, 'accumulated_route', idx))

          layer_failures = [r for r in all_layer_results if r['status'] == 'FAIL']
          route_failures = [r for r in report['accumulated_route'] if r['status'] == 'FAIL']
          unverified = [name for name, data in report['layers'].items() if data['status'] == 'UNVERIFIED']

          report['summary'] = {
              'layer_count': len(LAYERS),
              'discovered_test_count': len(all_layer_results),
              'layer_failures': len(layer_failures),
              'route_test_count': len(report['accumulated_route']),
              'route_failures': len(route_failures),
              'unverified_layers': unverified,
              'verdict': 'FAIL' if (layer_failures or route_failures) else ('WARN' if unverified else 'PASS'),
          }

          json_path = OUT / 'CAPABILITY_AUDIT.json'
          json_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          lines = [
              '# DOBO C0 Capability Layer Audit',
              '',
              f"Commit: `{report['commit']}`",
              '',
              'This audit adds no engine or geometry capability. It executes existing tests and the existing accumulated 1-2-3 route.',
              '',
              '| Layer | Status | Discovered tests |',
              '|---|---:|---:|',
          ]
          for name, data in report['layers'].items():
              lines.append(f"| `{name}` | **{data['status']}** | {data['discovered_tests']} |")
          lines += [
              '',
              f"Accumulated route: **{len(report['accumulated_route']) - len(route_failures)}/{len(report['accumulated_route'])} PASS**",
              '',
              f"Overall diagnostic verdict: **{report['summary']['verdict']}**",
              '',
              'A layer marked UNVERIFIED exists in the tree but currently exposes no discoverable `test_*.py` contract to this audit.',
          ]
          (OUT / 'CAPABILITY_AUDIT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print(json.dumps(report['summary'], indent=2))
          PY

      - name: Upload complete capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-c0-capability-layer-audit
          path: outputs-ci/c0-capability-audit
          if-no-files-found: error
          retention-days: 30

      - name: Enforce only observed failures, not missing future capability
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('outputs-ci/c0-capability-audit/CAPABILITY_AUDIT.json')
          if not path.exists():
              raise SystemExit('Capability audit report was not produced.')
          report = json.loads(path.read_text())
          summary = report['summary']
          if summary['layer_failures'] or summary['route_failures']:
              raise SystemExit(
                  f"Existing capability regression detected: "
                  f"layer_failures={summary['layer_failures']} "
                  f"route_failures={summary['route_failures']}"
              )
          print('No observed existing-capability regression.')
          print('Unverified layers:', ', '.join(summary['unverified_layers']) or 'none')
          PY
