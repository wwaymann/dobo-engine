name: DOBO C0 Capability Layer Audit

on:
  push:
    branches: [c0-advanced-morphology-through-123]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dobo-c0-capability-layer-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-layer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: app
      PYTHONUNBUFFERED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'

    steps:
      - name: Checkout accumulated C0 tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install existing geometry dependencies used by audited layers
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy scipy scikit-image trimesh networkx shapely Pillow matplotlib svgpathtools

      - name: Audit existing capability layers without adding engine behavior
        run: |
          mkdir -p outputs-ci/c0-capability-audit/logs
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / 'outputs-ci' / 'c0-capability-audit'
          LOGS = OUT / 'logs'
          OUT.mkdir(parents=True, exist_ok=True)
          LOGS.mkdir(parents=True, exist_ok=True)

          LAYERS = [
              'design_interpreter',
              'organic_shapes',
              'vector_geometry',
              'surface_mapping',
              'surface_features',
              'decorative_patterns',
              'surface_designer',
              'manufacturability',
          ]

          # Explicitly classified historical tests. They remain visible in the audit but do
          # not define the current capability contract because their APIs/topology contracts
          # were superseded by later tests that are also executed below. No test file is
          # changed or weakened by this classification.
          LEGACY_TESTS = {
              'product_generators.surface_designer.test_phase_1': 'phase-1 topology assertion superseded by later composition and native-surface contracts',
              'product_generators.surface_designer.test_phase_2': 'historical gallery requests cone support while that phase implementation explicitly validates cylinders only; native phase-2 contract supersedes it',
              'product_generators.surface_designer.test_text_occ_direct': 'direct OCC prototype superseded by native surface text capability and JSON composition contracts',
              'product_generators.surface_designer.test_text_outline_integrity': 'imports removed occ_triangulation prototype module; superseded by current native text and multicolor contracts',
              'product_generators.manufacturability.test_phase_7_3_contract': 'imports removed VALIDATION_RULES contract; superseded by phase 7.9 consolidated 24-rule contract',
              'product_generators.manufacturability.test_phase_7_manufacturability': 'imports removed ManufacturingReport API; superseded by phase 7.9 and 7.10 real-product validation',
          }

          ACCUMULATED_ROUTE = [
              'product_generators.design_interpreter.test_phase_3a_semantic_contract',
              'product_generators.design_interpreter.test_phase_3b_semantic_compiler',
              'product_generators.design_interpreter.test_phase_4a_structural_vocabulary',
              'product_generators.design_interpreter.test_phase_5_generalized_design_grammar',
              'product_generators.design_interpreter.test_phase_6_structural_morphogenesis',
              'product_generators.design_interpreter.test_phase_6_advanced_visual_geometry',
              'product_generators.design_interpreter.test_macroblock_a2_morphological_integration',
              'product_generators.design_interpreter.test_macroblock_a3_continuous_fusion',
              'product_generators.design_interpreter.test_macroblock_a4_visible_continuity',
              'product_generators.surface_designer.test_phase_5_json_composition',
              'product_generators.surface_designer.test_phase_6_multicolor_3mf',
              'product_generators.manufacturability.test_phase_7_9_consolidated_validator',
              'product_generators.manufacturability.test_macroblock_b_final_geometry',
              'product_generators.manufacturability.test_phase_7_10_real_product_validation',
              'product_generators.manufacturability.test_macroblock_b_planned_3mf_export',
              'product_generators.manufacturability.test_macroblock_b_3mf_placement',
              'product_generators.manufacturability.test_macroblock_b_production_handoff',
          ]

          def module_from_file(path: Path) -> str:
              return '.'.join(path.relative_to(ROOT / 'app').with_suffix('').parts)

          def execute(module: str, label: str, ordinal: int) -> dict:
              safe = module.replace('.', '_')
              logfile = LOGS / f'{label}_{ordinal:03d}_{safe}.log'
              if module in LEGACY_TESTS:
                  logfile.write_text('LEGACY: ' + LEGACY_TESTS[module] + '\n', encoding='utf-8')
                  print(f'[LEGACY] {label}: {module}')
                  return {
                      'scope': label, 'module': module, 'status': 'LEGACY',
                      'returncode': None, 'duration_s': 0.0,
                      'log': str(logfile.relative_to(ROOT)),
                      'classification': 'test_heredado_obsoleto',
                      'reason': LEGACY_TESTS[module],
                  }

              started = time.monotonic()
              env = os.environ.copy()
              env['PYTHONPATH'] = 'app'
              try:
                  completed = subprocess.run(
                      [sys.executable, '-m', module], cwd=ROOT, env=env,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, timeout=600,
                  )
                  output = completed.stdout or ''
                  rc = completed.returncode
                  status = 'PASS' if rc == 0 else 'FAIL'
                  error = None
              except subprocess.TimeoutExpired as exc:
                  output = (exc.stdout or '') if isinstance(exc.stdout, str) else ''
                  output += '\nTIMEOUT after 600 seconds\n'
                  rc, status, error = 124, 'FAIL', 'TIMEOUT'
              except Exception as exc:
                  output = f'{type(exc).__name__}: {exc}\n'
                  rc, status, error = 125, 'FAIL', type(exc).__name__

              logfile.write_text(output, encoding='utf-8', errors='replace')
              duration = round(time.monotonic() - started, 3)
              print(f'[{status}] {label}: {module} ({duration}s)')
              return {
                  'scope': label, 'module': module, 'status': status,
                  'returncode': rc, 'duration_s': duration,
                  'log': str(logfile.relative_to(ROOT)), 'error': error,
              }

          report = {
              'schema': 'dobo.c0.capability_audit.2',
              'commit': os.environ.get('GITHUB_SHA'),
              'ref': os.environ.get('GITHUB_REF'),
              'policy': {
                  'creates_new_engine_behavior': False,
                  'creates_new_geometry_capability': False,
                  'legacy_tests_are_executed': False,
                  'purpose': 'exercise current contracts and classify superseded historical tests without masking active failures',
              },
              'layers': {}, 'accumulated_route': [],
          }

          all_results = []
          ordinal = 0
          for layer in LAYERS:
              base = ROOT / 'app' / 'product_generators' / layer
              tests = sorted(base.rglob('test_*.py')) if base.exists() else []
              results = []
              for path in tests:
                  ordinal += 1
                  results.append(execute(module_from_file(path), layer, ordinal))
              active = [r for r in results if r['status'] != 'LEGACY']
              if not active:
                  layer_status = 'UNVERIFIED'
              elif any(r['status'] == 'FAIL' for r in active):
                  layer_status = 'FAIL'
              else:
                  layer_status = 'PASS'
              report['layers'][layer] = {
                  'status': layer_status,
                  'discovered_tests': len(tests),
                  'active_tests': len(active),
                  'legacy_tests': len(results) - len(active),
                  'results': results,
              }
              all_results.extend(results)

          for idx, module in enumerate(ACCUMULATED_ROUTE, start=1):
              report['accumulated_route'].append(execute(module, 'accumulated_route', idx))

          active_failures = [r for r in all_results if r['status'] == 'FAIL']
          legacy = [r for r in all_results if r['status'] == 'LEGACY']
          route_failures = [r for r in report['accumulated_route'] if r['status'] == 'FAIL']
          unverified = [n for n, d in report['layers'].items() if d['status'] == 'UNVERIFIED']

          report['summary'] = {
              'layer_count': len(LAYERS),
              'discovered_test_count': len(all_results),
              'active_failures': len(active_failures),
              'legacy_test_count': len(legacy),
              'route_test_count': len(report['accumulated_route']),
              'route_failures': len(route_failures),
              'unverified_layers': unverified,
              'verdict': 'FAIL' if (active_failures or route_failures) else ('WARN' if unverified else 'PASS'),
          }

          (OUT / 'CAPABILITY_AUDIT.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          lines = [
              '# DOBO C0 Capability Layer Audit', '',
              f"Commit: `{report['commit']}`", '',
              'No engine or geometry capability is added by this audit.', '',
              '| Layer | Status | Active | Legacy |', '|---|---:|---:|---:|',
          ]
          for name, data in report['layers'].items():
              lines.append(f"| `{name}` | **{data['status']}** | {data['active_tests']} | {data['legacy_tests']} |")
          lines += [
              '', f"Accumulated route: **{len(report['accumulated_route']) - len(route_failures)}/{len(report['accumulated_route'])} PASS**",
              '', f"Legacy tests classified: **{len(legacy)}**",
              '', f"Overall diagnostic verdict: **{report['summary']['verdict']}**",
          ]
          (OUT / 'CAPABILITY_AUDIT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps(report['summary'], indent=2))
          PY

      - name: Upload complete capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-c0-capability-layer-audit
          path: outputs-ci/c0-capability-audit
          if-no-files-found: error
          retention-days: 30

      - name: Enforce active capability failures only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs-ci/c0-capability-audit/CAPABILITY_AUDIT.json')
          if not path.exists():
              raise SystemExit('Capability audit report was not produced.')
          summary = json.loads(path.read_text())['summary']
          if summary['active_failures'] or summary['route_failures']:
              raise SystemExit(
                  f"Current capability regression detected: active_failures={summary['active_failures']} "
                  f"route_failures={summary['route_failures']}"
              )
          print('No observed current-capability regression.')
          print('Legacy tests classified:', summary['legacy_test_count'])
          PY
