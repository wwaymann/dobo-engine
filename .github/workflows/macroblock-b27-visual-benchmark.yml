name: DOBO Macroblock B27 Visual Geometry Benchmark

on:
  push:
    branches:
      - macroblock-b27-visual-benchmark
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dobo-macroblock-b27-visual-benchmark
  cancel-in-progress: true

jobs:
  benchmark-current-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: app
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg

    steps:
      - name: Checkout B27 benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install geometry and evidence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy scipy scikit-image trimesh networkx shapely Pillow matplotlib

      - name: Compile B27 benchmark harness
        run: |
          python -m py_compile app/product_generators/design_interpreter/visual_geometry_benchmark.py

      - name: Preserve structural morphogenesis baseline
        run: |
          python -m product_generators.design_interpreter.test_phase_6_structural_morphogenesis
          python -m product_generators.design_interpreter.test_phase_6_advanced_visual_geometry
          python -m product_generators.design_interpreter.test_macroblock_a_7_8
          python -m product_generators.design_interpreter.test_macroblock_a2_morphological_integration
          python -m product_generators.design_interpreter.test_macroblock_a3_continuous_fusion
          python -m product_generators.design_interpreter.test_macroblock_a4_visible_continuity

      - name: Run frozen 8-target visual geometry benchmark
        run: |
          python -m product_generators.design_interpreter.visual_geometry_benchmark

      - name: Upload B27 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-b27-visual-geometry-benchmark
          path: outputs/visual_geometry_benchmark
          if-no-files-found: error
          retention-days: 30
