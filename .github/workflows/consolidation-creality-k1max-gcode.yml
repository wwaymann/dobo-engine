name: DOBO Creality K1 Max G-code Boundary

on:
  pull_request:
    paths:
      - 'app/product_generators/production_package/creality_k1max.py'
      - 'app/product_generators/production_package/test_creality_k1max.py'
      - 'app/product_generators/production_package/__init__.py'
      - '.github/workflows/consolidation-creality-k1max-gcode.yml'
  push:
    branches:
      - production-creality-k1max-gcode
    paths:
      - 'app/product_generators/production_package/creality_k1max.py'
      - 'app/product_generators/production_package/test_creality_k1max.py'
      - 'app/product_generators/production_package/__init__.py'
      - '.github/workflows/consolidation-creality-k1max-gcode.yml'
  workflow_dispatch:

jobs:
  k1max-gcode-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Validate DOBO K1 Max production profile
        run: python -m pytest -q app/product_generators/production_package/test_creality_k1max.py
