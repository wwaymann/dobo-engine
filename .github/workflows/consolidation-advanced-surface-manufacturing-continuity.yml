name: DOBO Consolidation Advanced Surface Manufacturing Continuity

on:
  push:
    branches: [integration-consolidation-core]
    paths:
      - '.github/workflows/consolidation-advanced-surface-manufacturing-continuity.yml'
      - 'app/product_generators/design_interpreter/semantic_surface_bridge.py'
      - 'app/product_generators/design_interpreter/intelligent_surfaces.py'
      - 'app/product_generators/design_interpreter/structural_pipeline.py'
      - 'app/product_generators/design_interpreter/prompt_interpreter.py'
      - 'app/product_generators/design_interpreter/three_mf_export.py'
      - 'app/product_generators/organic_shapes/adaptive_layout.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/consolidation-advanced-surface-manufacturing-continuity.yml'
      - 'app/product_generators/design_interpreter/semantic_surface_bridge.py'
      - 'app/product_generators/design_interpreter/intelligent_surfaces.py'
      - 'app/product_generators/design_interpreter/structural_pipeline.py'
      - 'app/product_generators/design_interpreter/prompt_interpreter.py'
      - 'app/product_generators/design_interpreter/three_mf_export.py'
      - 'app/product_generators/organic_shapes/adaptive_layout.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advanced-surface-manufacturing-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: app
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DOBO_SEMANTIC_MODEL: ${{ vars.DOBO_SEMANTIC_MODEL || 'gpt-4.1-mini' }}
      DESIGN_PROMPT: 'Haz una maceta esférica hueca con abertura superior, la palabra DOBO en sobrerrelieve centrada al frente y debajo un motivo decorativo de hojas en sobrerrelieve.'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install existing consolidated stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai jsonschema numpy scipy scikit-image trimesh networkx shapely Pillow matplotlib cadquery

      - name: Execute one continuous prompt to manufacturing case
        run: |
          rm -rf outputs-ci/consolidation-advanced-surface-manufacturing
          mkdir -p outputs-ci/consolidation-advanced-surface-manufacturing
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile

          import matplotlib.pyplot as plt
          import numpy as np
          import trimesh

          from product_generators.design_interpreter.prompt_interpreter import (
              OpenAIResponsesSemanticClient,
              PromptSemanticInterpreter,
          )
          from product_generators.design_interpreter.semantic_surface_bridge import (
              SEMANTIC_SURFACE_BRIDGE_VERSION,
              SemanticSurfaceIntentBridge,
          )
          from product_generators.design_interpreter.structural_pipeline import DoboStructuralPipeline
          from product_generators.manufacturability.profile import ManufacturingProfile

          root = Path('outputs-ci/consolidation-advanced-surface-manufacturing')
          prompt = os.environ['DESIGN_PROMPT']
          if not os.environ.get('OPENAI_API_KEY', '').strip():
              raise RuntimeError('OPENAI_API_KEY is not configured; live continuity cannot be validated.')

          client = OpenAIResponsesSemanticClient(model=os.environ['DOBO_SEMANTIC_MODEL'])
          interpreted = PromptSemanticInterpreter(client).interpret(prompt)
          semantic = interpreted.program
          semantic.validate()

          surface_intents = SemanticSurfaceIntentBridge.compile(semantic)
          if not surface_intents:
              raise RuntimeError('Semantic surface bridge produced no layers.')

          result = DoboStructuralPipeline().generate_from_semantic(
              semantic,
              output_root=root,
              interpreter_version=interpreted.trace.interpreter_version,
              model=interpreted.trace.model,
              response_id=interpreted.trace.response_id,
              surface_intents=surface_intents,
          )
          result.validate()

          # Boundary-focused validation. STL->CadQuery compatibility and the
          # Creality production-project exporter already have their own accepted
          # gates. This gate validates the NEW continuous structural path using
          # the exact STL and standards-based, material-painted 3MF emitted by
          # DoboStructuralPipeline; it does not force that artifact through the
          # unrelated three-CadQuery-region Creality project inspector.
          mesh = trimesh.load_mesh(result.stl_path, process=True)
          if isinstance(mesh, trimesh.Scene):
              mesh = trimesh.util.concatenate(tuple(mesh.geometry.values()))
          if not isinstance(mesh, trimesh.Trimesh) or len(mesh.faces) == 0:
              raise RuntimeError('Generated STL does not contain a usable triangle mesh.')

          profile = ManufacturingProfile()
          extents = np.asarray(mesh.extents, dtype=float)
          production_size_valid = bool(
              extents[0] <= profile.max_size_x
              and extents[1] <= profile.max_size_y
              and extents[2] <= profile.max_size_z
          )

          three_mf_path = Path(result.three_mf_path)
          with ZipFile(three_mf_path, 'r') as package:
              corrupt_member = package.testzip()
              members = tuple(sorted(package.namelist()))
              model_xml = package.read('3D/3dmodel.model')
          if corrupt_member is not None:
              raise RuntimeError(f'3MF ZIP integrity failure at {corrupt_member}.')
          required_members = {
              '[Content_Types].xml',
              '_rels/.rels',
              '3D/3dmodel.model',
          }
          core_package_valid = required_members.issubset(members)
          core_ns = {'m': 'http://schemas.microsoft.com/3dmanufacturing/core/2015/02'}
          model_root = ET.fromstring(model_xml)
          build_items = model_root.findall('.//m:build/m:item', core_ns)
          material_bases = model_root.findall('.//m:basematerials/m:base', core_ns)
          model_triangles = model_root.findall('.//m:mesh/m:triangles/m:triangle', core_ns)
          painted_model_triangles = sum(
              1 for triangle in model_triangles
              if triangle.get('pid') is not None and triangle.get('p1') is not None
          )

          features = tuple(semantic.features)
          text_features = tuple(
              feature for feature in features
              if feature.form_hint == 'text'
              and 'dobo' in feature.concept.lower().split('_')
              and feature.surface_effect == 'raised'
              and feature.anchor.region == 'front'
          )
          decoration_features = tuple(
              feature for feature in features
              if feature.form_hint != 'text'
              and feature.surface_effect in {'raised', 'recessed', 'marking'}
          )
          layers = result.surface_program.layers
          text_layers = tuple(layer for layer in layers if layer.kind == 'text')
          relief_layers = tuple(layer for layer in layers if layer.kind == 'procedural_relief')

          vertices = np.asarray(mesh.vertices, dtype=float)
          stride = max(1, len(vertices) // 7000)
          sample = vertices[::stride]
          views = (
              ('front', 0, 0),
              ('side', 0, 90),
              ('top', 90, -90),
              ('iso', 28, 42),
          )
          visual_paths = []
          spans = np.maximum(np.ptp(sample, axis=0), 1.0)
          for name, elev, azim in views:
              fig = plt.figure(figsize=(6, 6))
              ax = fig.add_subplot(111, projection='3d')
              ax.scatter(sample[:, 0], sample[:, 1], sample[:, 2], s=0.2)
              ax.view_init(elev=elev, azim=azim)
              ax.set_box_aspect(tuple(spans))
              ax.set_axis_off()
              fig.tight_layout(pad=0)
              path = root / f'{name}.png'
              fig.savefig(path, dpi=180, bbox_inches='tight', pad_inches=0)
              plt.close(fig)
              visual_paths.append(str(path))

          audit = {
              'schema': 'dobo.consolidation.advanced_surface_manufacturing.3',
              'bridge_version': SEMANTIC_SURFACE_BRIDGE_VERSION,
              'prompt': prompt,
              'body_family': semantic.body.family,
              'opening_shape': semantic.body.opening_shape,
              'opening_width_ratio': semantic.body.opening_width_ratio,
              'opening_depth_ratio': semantic.body.opening_depth_ratio,
              'text_intent_preserved': bool(text_features),
              'decoration_intent_preserved': bool(decoration_features),
              'semantic_feature_count': len(features),
              'surface_layer_count': len(layers),
              'surface_text_layers': len(text_layers),
              'surface_relief_layers': len(relief_layers),
              'surface_color_zones': result.surface_report.color_zones,
              'stl_exists': Path(result.stl_path).is_file(),
              'three_mf_exists': three_mf_path.is_file(),
              'three_mf_material_count': result.three_mf.material_count,
              'three_mf_painted_triangles': result.three_mf.painted_triangle_count,
              'three_mf_core_package_valid': core_package_valid,
              'three_mf_build_items': len(build_items),
              'three_mf_xml_materials': len(material_bases),
              'three_mf_xml_triangles': len(model_triangles),
              'three_mf_xml_painted_triangles': painted_model_triangles,
              'watertight': bool(mesh.is_watertight),
              'winding_consistent': bool(mesh.is_winding_consistent),
              'production_size_valid': production_size_valid,
              'mesh_extents_mm': extents.tolist(),
              'cad_adapter_boundary_previously_accepted': True,
              'creality_project_boundary_previously_accepted': True,
              'visual_evidence': visual_paths,
          }
          required = (
              audit['body_family'] == 'spherical',
              audit['opening_shape'] in {'circular', 'elliptical'},
              0.15 <= audit['opening_width_ratio'] < 0.95,
              0.15 <= audit['opening_depth_ratio'] < 0.95,
              audit['text_intent_preserved'],
              audit['decoration_intent_preserved'],
              audit['surface_text_layers'] >= 1,
              audit['surface_relief_layers'] >= 1,
              audit['surface_color_zones'] >= 2,
              audit['stl_exists'],
              audit['three_mf_exists'],
              audit['three_mf_material_count'] >= 2,
              audit['three_mf_painted_triangles'] > 0,
              audit['three_mf_core_package_valid'],
              audit['three_mf_build_items'] == 1,
              audit['three_mf_xml_materials'] >= 2,
              audit['three_mf_xml_triangles'] == result.three_mf.triangle_count,
              audit['three_mf_xml_painted_triangles'] > 0,
              audit['watertight'],
              audit['winding_consistent'],
              audit['production_size_valid'],
              all(Path(path).is_file() and Path(path).stat().st_size > 0 for path in visual_paths),
          )
          audit['verdict'] = 'PASS' if all(required) else 'FAIL'
          (root / 'CONTINUITY_AUDIT.json').write_text(
              json.dumps(audit, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          (root / 'PROMPT.txt').write_text(prompt + '\n', encoding='utf-8')
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          if audit['verdict'] != 'PASS':
              raise RuntimeError('Advanced morphology did not preserve surface/manufacturing continuity.')
          PY

      - name: Upload continuous integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobo-consolidation-advanced-surface-manufacturing
          path: outputs-ci/consolidation-advanced-surface-manufacturing
          if-no-files-found: error
          retention-days: 30
